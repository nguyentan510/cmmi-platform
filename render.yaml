# ==============================================================================
# CMMI Platform · Render.com Infrastructure Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + SQLAlchemy + APScheduler)
  # ----------------------------------------------------------------------------
  - type: web
    name: cmmi-backend
    runtime: python
    rootDir: backend
    plan: free # or starter
    region: singapore # Closest region to Vietnam
    buildCommand: "pip install poetry==2.5.1 && poetry install --only main"
    startCommand: "poetry run alembic upgrade head && poetry run python -m app.bootstrap --if-needed --email admin@example.com && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Neon or Render PostgreSQL URL
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. '["https://{base-url}"]'
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (Vite + React 19) — 100% Free on Render
  # ----------------------------------------------------------------------------
  - type: web
    name: cmmi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: redirect
        source: "/docs"
        destination: "https://{base-url}/docs"
      - type: redirect
        source: "/redoc"
        destination: "https://{base-url}/redoc"
      - type: redirect
        source: "/openapi.json"
        destination: "https://{base-url}/openapi.json"
      - type: redirect
        source: "/llms.txt"
        destination: "https://{base-url}/llms.txt"
      - type: redirect
        source: "/llms-full.txt"
        destination: "https://{base-url}/llms-full.txt"
      - type: redirect
        source: "/api/*"
        destination: "https://{base-url}/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend server URL: https://{base-url}

